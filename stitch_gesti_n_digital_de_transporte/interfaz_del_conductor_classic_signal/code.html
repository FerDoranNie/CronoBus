<body class="bg-surface-container-lowest font-body-md text-on-surface flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full top-0 sticky border-b border-outline-variant bg-surface-container-lowest z-40 flex justify-between items-center px-margin-mobile h-16 transition-colors duration-200">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary">directions_bus</span>
<span class="font-headline-md text-headline-md font-bold text-primary">CronoBus</span>
</div>
<button class="p-2 hover:bg-surface-container-low rounded-full transition-colors duration-200 active:opacity-80 group">
<span class="material-symbols-outlined text-primary group-hover:text-primary-container">notifications</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 px-margin-mobile py-md flex flex-col gap-lg pb-24">
<!-- Next Departure Card -->
<section class="w-full">
<div class="bg-surface-container-lowest border border-outline rounded-lg p-lg flex flex-col items-center justify-center gap-sm">
<span class="font-label-bold text-label-bold text-outline uppercase tracking-wider">PRÓXIMA SALIDA</span>
<span class="font-display-lg text-display-lg text-secondary">14:30</span>
<div class="flex items-center gap-xs mt-2 px-3 py-1 bg-secondary-container rounded-full">
<span class="material-symbols-outlined text-on-secondary-container text-[16px]">check_circle</span>
<span class="font-label-md text-label-md text-on-secondary-container">A tiempo</span>
</div>
</div>
</section>
<!-- Interval Section -->
<section class="grid grid-cols-2 gap-sm">
<!-- Unidad Anterior -->
<div class="bg-surface-container-lowest border border-outline rounded-lg p-md flex flex-col gap-sm">
<span class="font-body-sm text-body-sm text-on-surface-variant">Unidad Anterior</span>
<div class="flex items-center justify-between">
<span class="font-headline-md text-headline-md text-on-surface">4 min</span>
<span class="material-symbols-outlined text-outline">history</span>
</div>
<div class="w-full bg-surface-variant h-1 mt-auto rounded-full overflow-hidden">
<div class="bg-primary h-full w-[40%] rounded-full"></div>
</div>
</div>
<!-- Unidad Siguiente -->
<div class="bg-surface-container-lowest border border-tertiary-fixed-dim rounded-lg p-md flex flex-col gap-sm relative overflow-hidden">
<div class="absolute inset-0 bg-tertiary-fixed-dim/10 pointer-events-none"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant relative z-10">Unidad Siguiente</span>
<div class="flex items-center justify-between relative z-10">
<span class="font-headline-md text-headline-md text-on-surface">8 min</span>
<span class="material-symbols-outlined text-tertiary-fixed-dim">warning</span>
</div>
<div class="w-full bg-surface-variant h-1 mt-auto rounded-full overflow-hidden relative z-10">
<div class="bg-tertiary-fixed-dim h-full w-[80%] rounded-full"></div>
</div>
</div>
</section>
<!-- Quick Alerts -->
<section class="flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md-mobile text-on-surface">Alertas Rápidas</h2>
<div class="grid grid-cols-3 gap-sm">
<button class="bg-surface-container-lowest border border-outline rounded-lg p-md flex flex-col items-center justify-center gap-xs hover:bg-surface-container-low transition-colors duration-200 active:bg-surface-container-high group">
<span class="material-symbols-outlined text-error text-[32px] group-active:scale-95 transition-transform">car_crash</span>
<span class="font-label-md text-label-md text-on-surface">Accidente</span>
</button>
<button class="bg-surface-container-lowest border border-outline rounded-lg p-md flex flex-col items-center justify-center gap-xs hover:bg-surface-container-low transition-colors duration-200 active:bg-surface-container-high group">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-[32px] group-active:scale-95 transition-transform">traffic</span>
<span class="font-label-md text-label-md text-on-surface">Tráfico</span>
</button>
<button class="bg-surface-container-lowest border border-outline rounded-lg p-md flex flex-col items-center justify-center gap-xs hover:bg-surface-container-low transition-colors duration-200 active:bg-surface-container-high group">
<span class="material-symbols-outlined text-primary text-[32px] group-active:scale-95 transition-transform">block</span>
<span class="font-label-md text-label-md text-on-surface">Bloqueo</span>
</button>
</div>
</section>

<button class="flex-1 py-sm font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors focus:bg-secondary-container focus:text-on-secondary-container">Baja</button>
<button class="flex-1 py-sm font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors focus:bg-secondary-container focus:text-on-secondary-container bg-surface-container-low">Media</button>
<button class="flex-1 py-sm font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors focus:bg-secondary-container focus:text-on-secondary-container">Alta</button>
